[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-bench"
version = "0.1.0"
description = "A fixed live-API benchmark for Basalt and Strata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LesterLyu"}]
dependencies = []

[project.scripts]
local-llm-bench = "local_llm_bench.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_llm_bench = ["data/*.json"]
